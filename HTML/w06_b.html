<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="https://bootswatch.com/5/superhero/bootstrap.min.css">
</head>
  <body>
    <div class="container-fluid m-2">
        <div class="row">
            <div class="col bg-primary bg-opacity-10 d-flex justify-content-center">
                <p class="text-danger fs-2">Navbar</p>
            </div>
        </div>
        <div class="row">
            <div class="col-3 bg-warning bg-opacity-10 p-5">
                <img src="https://picsum.photos/200/200?random=1" alt="pic" class="rounded-circle shadow-lg">
            </div>
            <div class="col bg-info bg-opacity-10">
                <p class="display-1 fw-bold text-info">Hello CT</p>
            </div>
        </div>
        <div class="row bg-danger bg-opacity-10">
            <p class="text-success fs-2">Footer</p>
        </div>
    </div>

  

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
