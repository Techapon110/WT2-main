<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Form HTML</title>
</head>
<body>
    <h1>List</h1>
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Mango</li>
        <li>Grapes</li>
    </ol>






    <input type="url" id="" name=""><br>
    <input type="checkbox" id="terms" name="terms"><label for="terms"> I agree to the terms and conditions</label><br>
    <input type="radio" id="male" name="gender" value="male"> <label for="male">Male</label> 
    <input type="radio" id="female" name="gender" value="female"> <label for="female">Female</label> <br>
    <input type="range" id="age" name="age" min="0" max="250"><br>
    <input type="color" id="" name=""><br>
    <input type="date" id="" name=""><br>
    <input type="datetime-local" id="" name=""><br>
    <input type="time" id="" name=""><br>
    <input type="email" id="" name=""><br>
    <input type="tel" id="" name=""><br>
    <input type="file" id="" name=""><br>
    <select name="" id="">
        <option value="50">Apple</option>
        <option value="40">Banana</option>
        <option value="30">Mango</option>
        <option value="20">Grapes</option>
    </select><br>


    <hr>
    <form action="" >
        <fieldset>
            <legend>Login form</legend>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter username"><br><br>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter password" required><br><br>
            
            <input type="submit" value="Login">
            <input type="reset" value="Reset">
        </fieldset>
    </form>
</body>
</html>
