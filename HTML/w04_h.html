<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        .container{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .text-ct{
            font-size: 200px;
            font-weight: bold;
            color: transparent;
            background-image: url(https://picsum.photos/800/300?random=5);
            background-clip: text;
            filter: drop-shadow(5px 5px 8px green);
            animation: movement 0.3s infinite linear;
        }
        .text-ct:hover{
            animation-play-state: paused;
        }


@keyframes movement {
    0%{
        /* transform: scale(1) translate(0,0); */
        transform: rotate(0);
    }
    100%{
        /* transform: scale(1.5) translate(0,-120px); */
        transform: rotate(-360deg);
    }
}

    </style>
</head>
<body>
    <div class="container">
    <p class="text-ct">Hello CT</p>
    </div>
</body>

</html>
