<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Application</title>
        <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
        .container{
            width: 50%;
            height: 96px;
            background: #76d1cd8f;
            position: fixed;
            bottom: 0;
            justify-self: center;
            border-top-left-radius: 15px;
            border-top-right-radius: 15px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        .iconx{
            font-size: 64px;
        }
        .iconx:hover{
            transform: translate(0, -48px) scale(1.2) rotate(15deg);
            cursor: pointer;
        }
        .blue{
            color: blue;
        }
        .red{
            color: red;
        }
        .green{
            color: green;
        }
        .purple{
            color: purple;
        }
        .black{
            color: black;
        }

    </style>
</head>
<body>
    <div class="container">
    <i class="fa-brands fa-meta iconx iconx blue" ></i>
    <i class="fa-brands fa-youtube iconx red" ></i>
    <i class="fa-brands fa-line iconx green" ></i>
    <i class="fa-brands fa-instagram iconx purple" ></i>
    <i class="fa-brands fa-x iconx black"></i>
    <i class="fa-brands fa-linkedin iconx blue" ></i>
    </div>
</body>
</html>
