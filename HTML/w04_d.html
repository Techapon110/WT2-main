<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        .btn{
            border: none;
            background-color: black;
            color: white;
            font-size: 20px;
            border-radius: 12px;
            width: 120px;
            height: 40px;
            cursor: pointer;
            transform: .3s;
            
            &:hover{
                transform: scale(1.1);
                border: 1px solid black;
                background-color: white;
                color: black;
            }
        }
    </style>
</head>
<body>
    <button class="btn">Cilck Me</button>
    <button class="btn">Cilck Me</button>
    <button class="btn">Cilck Me</button>
    <button class="btn">Cilck Me</button>

</body>
</html>
