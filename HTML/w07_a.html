<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        .container{
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .area-1{
            background: red;
            flex: 1;
        }
        .area-2{
            background: green;
            flex: 3;
        }
        .area-3{
            background: blue;
            flex: 5;
        }
    </style>
</head>
<body>
    <div class="container">
       <div class="area-1"></div> 
       <div class="area-2"></div> 
       <div class="area-3"></div> 
    </div>
</body>
</html>
